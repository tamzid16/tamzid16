<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="MD Tamzid Hossen Omi - IoT, Embedded Systems, Robotics and AI Engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#150f33"/>
      <stop offset="1" stop-color="#2a0f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb800"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00d4ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .spin-a { transform-origin: 1070px 160px; animation: spin 24s linear infinite; }
    .spin-b { transform-origin: 1070px 160px; animation: spin 16s linear infinite reverse; }
    .pulse  { transform-origin: 1070px 160px; animation: pulse 3.2s ease-in-out infinite; }
    .scan   { animation: scan 6s ease-in-out infinite; }
    .fade   { animation: fade 3.2s ease-in-out infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(0.92); opacity: 0.75; } 50% { transform: scale(1.06); opacity: 1; } }
    @keyframes scan  { 0%,100% { transform: translateX(0); opacity: 0.0; } 10%,90% { opacity: 0.9; } 50% { transform: translateX(560px); } }
    @keyframes fade  { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'SFMono-Regular', Consolas, 'Courier New', monospace; }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1070" cy="160" r="210" fill="url(#glow)"/>

    <g class="pulse">
      <circle cx="1070" cy="160" r="54" fill="none" stroke="#00d4ff" stroke-width="3"/>
      <circle cx="1070" cy="160" r="30" fill="#00d4ff" fill-opacity="0.18" stroke="#9af0ff" stroke-width="2"/>
      <circle cx="1070" cy="160" r="12" fill="#e6fbff"/>
    </g>
    <g class="spin-a">
      <circle cx="1070" cy="160" r="95" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round"/>
    </g>
    <g class="spin-b">
      <circle cx="1070" cy="160" r="135" fill="none" stroke="#ffb800" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="60 24 6 24"/>
    </g>

    <rect x="60" y="62" width="64" height="5" rx="2.5" fill="url(#gold)"/>
    <text x="60" y="118" font-size="24" fill="#9aa8c7" letter-spacing="6" class="mono">HELLO, I AM</text>
    <text x="60" y="190" font-size="58" font-weight="800" fill="url(#accent)">MD Tamzid Hossen Omi</text>
    <text x="62" y="232" font-size="26" font-weight="600" fill="#e6edf7">IoT  /  Embedded Systems  /  Robotics  /  AI Engineering</text>
    <text x="62" y="272" font-size="19" fill="#8b98b8" class="mono fade">B.Sc. IoT &amp; Robotics Engineering  |  UFTB  |  Dhaka, Bangladesh</text>

    <rect x="60" y="296" width="120" height="3" rx="1.5" fill="url(#accent)" class="scan"/>
  </g>
</svg>
